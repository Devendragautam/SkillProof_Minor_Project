<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.canvas{width:790px;padding:16px 10px;background:#fff}
.title{text-align:center;font-size:18.5px;font-weight:700;color:#1f2937;margin-bottom:8px}
svg{display:block}
</style></head><body>
<div class="canvas" id="shot">
  <div class="title">UML Sequence Diagram: One Proctored Question Cycle in SkillProof</div>
  <svg width="770" height="640" viewBox="0 0 770 640">
    <defs>
      <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker>
      <marker id="arb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9A3412"/></marker>
    </defs>
    <!-- participant boxes -->
    <g font-family="Arial" font-size="13" font-weight="700" fill="#1f2f22" text-anchor="middle">
      <rect x="30" y="10" width="160" height="40" rx="6" fill="#F1F5F0" stroke="#436446" stroke-width="1.8"/>
      <text x="110" y="28">Candidate</text><text x="110" y="43">Browser (SPA)</text>
      <rect x="240" y="10" width="160" height="40" rx="6" fill="#F1F5F0" stroke="#436446" stroke-width="1.8"/>
      <text x="320" y="28">Web API</text><text x="320" y="43">Next.js handlers</text>
      <rect x="450" y="10" width="150" height="40" rx="6" fill="#FAF6EC" stroke="#7A5C2E" stroke-width="1.8"/>
      <text x="525" y="28">Proctor Service</text><text x="525" y="43">socket.io :3003</text>
      <rect x="640" y="10" width="120" height="40" rx="6" fill="#F1F5F0" stroke="#436446" stroke-width="1.8"/>
      <text x="700" y="28">Prisma /</text><text x="700" y="43">SQLite</text>
    </g>
    <!-- lifelines -->
    <g stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5,4">
      <line x1="110" y1="50" x2="110" y2="620"/>
      <line x1="320" y1="50" x2="320" y2="620"/>
      <line x1="525" y1="50" x2="525" y2="620"/>
      <line x1="700" y1="50" x2="700" y2="620"/>
    </g>
    <!-- loop frame -->
    <rect x="55" y="70" width="690" height="330" fill="none" stroke="#436446" stroke-width="1.6" stroke-dasharray="7,4" rx="4"/>
    <g font-family="Arial" font-size="12" font-weight="700" fill="#fff"><rect x="65" y="62" width="330" height="20" rx="3" fill="#436446"/><text x="72" y="76">loop &mdash; one cycle per dealt question</text></g>
    <!-- messages -->
    <g font-family="Arial" font-size="11.6" fill="#334155">
      <line x1="110" y1="100" x2="320" y2="100" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/>
      <text x="215" y="93" text-anchor="middle" font-weight="600">1. POST /api/assessment/:id/next (session cookie)</text>

      <line x1="320" y1="126" x2="700" y2="126" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/>
      <text x="510" y="119" text-anchor="middle" font-weight="600">2. deal next question &mdash; snapshot effective time limit, set dealtAt / deadlineAt, activeFlag invariant</text>

      <line x1="320" y1="152" x2="110" y2="152" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/>
      <text x="215" y="145" text-anchor="middle" font-weight="600">3. question payload + server deadline</text>

      <line x1="110" y1="178" x2="525" y2="178" stroke="#7A5C2E" stroke-width="1.7" marker-end="url(#arb)"/>
      <text x="318" y="171" text-anchor="middle" font-weight="600" fill="#7A5C2E">4. proctor:join-candidate + live events (edits, pastes, focus, test runs)</text>

      <line x1="525" y1="204" x2="320" y2="204" stroke="#7A5C2E" stroke-width="1.7" marker-end="url(#arb)"/>
      <text x="422" y="197" text-anchor="middle" font-weight="600" fill="#7A5C2E">5. broadcast to recruiter room (live session cards)</text>

      <line x1="110" y1="232" x2="320" y2="232" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/>
      <text x="215" y="225" text-anchor="middle" font-weight="600">6. POST run / submit &mdash; code + language</text>

      <line x1="320" y1="258" x2="700" y2="258" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/>
      <text x="510" y="251" text-anchor="middle" font-weight="600">7. judge in sandbox &mdash; CPU-limited, no network; deadline re-checked server-side</text>

      <line x1="320" y1="284" x2="110" y2="284" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/>
      <text x="215" y="277" text-anchor="middle" font-weight="600">8. per-test verdicts, metrics, score</text>

      <line x1="110" y1="312" x2="320" y2="312" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/>
      <text x="215" y="305" text-anchor="middle" font-weight="600">9. explain round &mdash; POST /explain answers</text>

      <line x1="320" y1="338" x2="700" y2="338" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/>
      <text x="510" y="331" text-anchor="middle" font-weight="600">10. consistency evaluation persisted with submission</text>
    </g>
    <!-- post-loop messages -->
    <g font-family="Arial" font-size="11.6" fill="#334155">
      <line x1="110" y1="428" x2="320" y2="428" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/>
      <text x="215" y="421" text-anchor="middle" font-weight="600">11. POST /assessment/:id/complete</text>
      <line x1="320" y1="454" x2="700" y2="454" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/>
      <text x="510" y="447" text-anchor="middle" font-weight="600">12. aggregate evidence &mdash; Report (overall, confidence, AI-risk, skill scores)</text>
      <line x1="320" y1="480" x2="110" y2="480" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/>
      <text x="215" y="473" text-anchor="middle" font-weight="600">13. verified profile + evidence report</text>
      <line x1="110" y1="508" x2="320" y2="508" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/>
      <text x="215" y="501" text-anchor="middle" font-weight="600">14. certificate issue &mdash; SP-code + QR PDF (recruiter)</text>
      <line x1="525" y1="540" x2="320" y2="540" stroke="#7A5C2E" stroke-width="1.7" marker-end="url(#arb)"/>
      <text x="422" y="533" text-anchor="middle" font-weight="600" fill="#7A5C2E">15. proctor transcript flushed to /api/proctor/events (bounded retry queue)</text>
      <line x1="320" y1="568" x2="700" y2="568" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/>
      <text x="510" y="561" text-anchor="middle" font-weight="600">16. ProctorEventRecord upserted by id for post-run review</text>
    </g>
  </svg>
</div>
</body></html>
