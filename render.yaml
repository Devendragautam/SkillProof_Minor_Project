# ─────────────────────────────────────────────────────────────────────────────
# SkillProof — Render Blueprint
#
# Deploy with this file:  Render Dashboard → "New +" → "Blueprint" → pick this
# repo → Render reads render.yaml and creates BOTH services.
#
# After the first deploy you must fill the `sync: false` variables (Render
# prompts for them during blueprint creation) — the complete checklist,
# including where to get the AI API key, is in DEPLOY.md.
#
# Plan notes:
#   • skillproof-web needs `starter` (or higher) because PERSISTENT DISKS are
#     not available on the free plan. On free, SQLite resets on every deploy.
#   • skillproof-proctor can stay on `free` (it spins down when idle; the
#     browser client reconnects automatically).
# ─────────────────────────────────────────────────────────────────────────────
services:
  # ── Main app: Next.js 16 (standalone output) + Prisma/SQLite ───────────────
  - type: web
    name: skillproof-web
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    # Applies the Prisma schema to the SQLite file on the mounted disk before
    # every deploy. Non-destructive by design (no --accept-data-loss).
    preDeployCommand: npx prisma db push --skip-generate
    startCommand: npm run start:node
    healthCheckPath: /api/health
    disk:
      name: skillproof-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      # SQLite lives on the mounted disk so data survives deploys/restarts
      - key: DATABASE_URL
        value: file:/var/data/skillproof.db
      # 384-bit random secret, generated by Render — required in production
      - key: SESSION_SECRET
        generateValue: true
      # ── AI provider (REQUIRED for AI features) ────────────────────────────
      # Get a key at https://z.ai/manage-apikey/apikey-list (or use any
      # OpenAI-compatible provider — see DEPLOY.md for the alternatives)
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.z.ai/api/paas/v4
      - key: AI_MODEL
        value: glm-4.6
      # ── Initial recruiter account (provisioned automatically on first
      #    login — the question bank seeds itself the same way) ────────────
      - key: SKILLPROOF_RECRUITER_EMAIL
        sync: false
      - key: SKILLPROOF_RECRUITER_PASSWORD
        sync: false
      # ── Live proctoring wiring (fill AFTER the proctor service exists) ──
      # e.g. https://skillproof-proctor-xxxx.onrender.com
      - key: NEXT_PUBLIC_PROCTOR_URL
        sync: false
      # Shared secret between proctor → web transcript ingest; MUST match the
      # proctor service's PROCTOR_INGEST_KEY
      - key: PROCTOR_INGEST_KEY
        sync: false
      # ── Demo mode OFF in production (no demo autofill / demo accounts) ──
      - key: DEMO_MODE
        value: "0"
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "0"

  # ── Live proctoring: socket.io service ────────────────────────────────────
  - type: web
    name: skillproof-proctor
    runtime: node
    plan: free
    rootDir: mini-services/proctor-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Render assigns PORT automatically; the service reads process.env.PORT
      # Where transcripts are flushed: the MAIN app's ingest endpoint, e.g.
      # https://skillproof-web-xxxx.onrender.com/api/proctor/events
      - key: PROCTOR_PERSIST_URL
        sync: false
      # MUST match the web service's PROCTOR_INGEST_KEY
      - key: PROCTOR_INGEST_KEY
        sync: false
      # Recommended: restrict cross-origin socket connections to the main app,
      # e.g. https://skillproof-web-xxxx.onrender.com (default: *)
      - key: PROCTOR_CORS_ORIGIN
        sync: false
